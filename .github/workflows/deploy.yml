name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: false    # 关闭自动取消，避免长任务互相打断

on:
  schedule:
    # 北京 03:15 触发，触发后随机停 0-20 分钟就开跑（不再提前拉起、也不再等到别的时刻）。
    # 阅读脚本本身要跑约 2 小时 5 分（READ_NUM=240 × 30 秒），而且跑完就直接推送，
    # 所以「阅读完成」那条消息大约落在 05:20~05:40。
    #   03:15 触发 -> 随机 0-20 分 -> 开跑 -> 阅读约 2 小时 5 分 -> 直接推送
    # 分针也刻意不写 00（整点是 GitHub 最挤的时候）。
    # ⚠️ 这里 cron 就等于开跑时刻，GitHub 的排队延迟会全额顺延推送时刻
    #    （本仓库实测被拖过 1 小时 40 分以上）。想更准点，就得提前把 job 拉起来、
    #    再在 job 内用绝对时刻等到目标时刻（上一版 00:35 触发就是那种写法）。
    - cron: '15 19 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead  # 指定环境
    # 单次最长 = 触发后的随机 20 分 + 脚本（READ_NUM=240、每次 30 秒 ≈ 2 小时 5 分）
    # ≈ 2 小时 25 分。这里配 300 分钟（5 小时），留约一倍余量；
    # READ_NUM 要大幅调大时先按这个算一下（GitHub 的 job 硬上限是 360 分钟）。
    timeout-minutes: 300

    steps:

    - name: Set DNS to Google's DNS
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    # ⚠️ 版本别往回调：v4 / v5 声明的是 Node 20，GitHub 已弃用，
    #    日志顶部会挂一条 ##[warning]"Node.js 20 is deprecated"（不是报错）。
    #    checkout v5 / setup-python v6 起改用 Node 24。
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

    # 触发后就地随机停 0-20 分钟再开跑，让每天的开跑时刻（以及跑完的推送时刻）
    # 不固定成一个"机器特征"。
    # 推送不额外叠加随机：脚本跑完就推，保持"跑完直接推送"。
    # 只对定时触发生效；手动触发（测试）不加，方便复现。
    - name: Random 0-20 min delay
      if: github.event_name == 'schedule'
      run: |
        j=$((RANDOM % 1201))
        echo "随机延迟 $((j / 60)) 分 $((j % 60)) 秒后再开跑"
        sleep "$j"

    - name: Run deployment script
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}   # 企业微信群机器人 Webhook
        WEWORK_MSG_TYPE: ${{ vars.WEWORK_MSG_TYPE }}     # markdown 或 text
        READ_NUM: ${{ vars.READ_NUM }}  # 使用 Repository Variables

      run: |
        # READ_NUM 本该来自 Repository Variable。变量被删/改名时，
        # config.py 的 `int(os.getenv('READ_NUM') or 40)` 会**静默退化成 40 次（20 分钟）**，
        # 读书时长腰斩而且一句错都不报 —— 这里兜一下，并打一条警告 annotation。
        if [ -z "$READ_NUM" ]; then
          echo "::warning::READ_NUM 没配（Repository Variable），本次按 240 兜底。"
          export READ_NUM=240
        fi
        echo "本次阅读次数：$READ_NUM（约 $((READ_NUM / 2)) 分钟）"
        python main.py

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
